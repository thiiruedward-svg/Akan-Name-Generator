<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Akan Name Generator</title>
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <main class="container">
            <h1>Akan Name Generator</h1>

            <p class="intro">
                Discover your Akan Name based on the day of the week you were born.
            </p>

            <form id="akanForm">
                <div class="form-group">
                    <label for="day">Day of birth:</label>
                    <input type="number" id="day" min="1" max="31" placeholder="Enter day (1-31) required">
                </div>

                <div class="form-group">
                    <label for="month">Month of birth:</label>
                    <input type="number" id="month" min="1" max="12" placeholder="Enter month (1-12)" required>
                </div> 

                <div class="form-group">
                    <label for="month">Year of birth:</label>
                    <input type="number" id="year" min="1" placeholder="Enter year" required>
                </div> 

                <div class="form-group">
                    <label for="gender">Select gender:</label>
                    <select id="gender" required>
                        <option value="">Choose gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <button type="submit">Generate My Akan Name</button>
            </form>

            <section id="result" aria-live="polite">
                <h2>Your Result</h2>
                <p id="message">Your Akan Name will appear here.</p>
            </section>
        </main>
    </body>
</html>
